-size="15" font-weight="600" fill="#213341">edit 更新</text><text x="380.0" y="338.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#213341">往 Q 高处推，不超过 β</text><rect x="40" y="290" width="200" height="66" rx="10" fill="#e8f1fb" stroke="#1d6fb8" stroke-width="1.6"/><text x="140.0" y="319.0" text-anchor="middle" font-size="15" font-weight="600" fill="#213341">VLA 成功 BC</text><text x="140.0" y="338.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#213341">只用成功 episode</text><polyline points="860,250 720,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah-0)"/><polyline points="840,250 480,305" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah-0)"/><polyline points="825,240 240,310" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah-0)"/><polyline points="620,290 620,100" fill="none" stroke="#a34f08" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-0)"/><polyline points="380,290 400,100" fill="none" stroke="#8b375d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-0)"/><polyline points="140,290 210,100" fill="none" stroke="#1d6fb8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-0)"/><text x="500" y="392" text-anchor="middle" font-size="12.5" fill="#536777">实线：数据流　虚线：参数更新回到对应部件</text></svg>
