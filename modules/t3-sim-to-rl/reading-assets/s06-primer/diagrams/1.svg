<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 405" role="img" aria-label="EXPO-FT 一次 online RL 循环" style="font-family:system-ui,sans-serif"><title>EXPO-FT 一次 online RL 循环</title><defs><marker id="ah-0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect x="10" y="30" width="110" height="66" rx="10" fill="#f1f7f9" stroke="#126578" stroke-width="1.6"/><text x="65.0" y="59.0" text-anchor="middle" font-size="15" font-weight="600" fill="#213341">observation s</text><text x="65.0" y="78.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#213341">当前状态</text><rect x="160" y="30" width="140" height="66" rx="10" fill="#e8f1fb" stroke="#1d6fb8" stroke-width="1.6"/><text x="230.0" y="59.0" text-anchor="middle" font-size="15" font-weight="600" fill="#213341">冻结的 VLA</text><text x="230.0" y="78.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#213341">采 N 个候选</text><rect x="340" y="30" width="130" height="66" rx="10" fill="#f8ecf2" stroke="#8b375d" stroke-width="1.6"/><text x="405.0" y="59.0" text-anchor="middle" font-size="15" font-weight="600" fill="#213341">edit policy</text><text x="405.0" y="78.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#213341">每个候选 ±β 修正</text><rect x="510" y="30" width="150" height="66" rx="10" fill="#fbf0e6" stroke="#a34f08" stroke-width="1.6"/><text x="585.0" y="59.0" text-anchor="middle" font-size="15" font-weight="600" fill="#213341">critic ensemble</text><text x="585.0" y="78.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#213341">给 2N 个候选打分</text><rect x="700" y="30" width="130" height="66" rx="10" fill="#f1f7f9" stroke="#126578" stroke-width="1.6"/><text x="765.0" y="59.0" text-anchor="middle" font-size="15" font-weight="600" fill="#213341">OTF</text><text x="765.0" y="78.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#213341">执行 Q 最高者</text