<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-label="RLT 与 EXPO-FT 使用 Q 的方式" style="font-family:system-ui,sans-serif"><title>RLT 与 EXPO-FT 使用 Q 的方式</title><defs><marker id="ah-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect x="10" y="10" width="470" height="300" rx="14" fill="#fafcfd" stroke="#d9e4e9"/><text x="245" y="40" text-anchor="middle" font-size="17" font-weight="650" fill="#213341">RLT：沿梯度走</text><rect x="40" y="70" width="170" height="60" rx="10" fill="#e8f1fb" stroke="#1d6fb8" stroke-width="1.6"/><text x="125.0" y="96.0" text-anchor="middle" font-size="15" font-weight="600" fill="#213341">VLA reference</text><text x="125.0" y="115.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#213341">一个 chunk</text><rect x="280" y="70" width="170" height="60" rx="10" fill="#f8ecf2" stroke="#8b375d" stroke-width="1.6"/><text x="365.0" y="96.0" text-anchor="middle" font-size="15" font-weight="600" fill="#213341">small actor</text><text x="365.0" y="115.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#213341">输入 token + reference</text><rect x="160" y="210" width="180" height="60" rx="10" fill="#fbf0e6" stroke="#a34f08" stroke-width="1.6"/><text x="250.0" y="236.0" text-anchor="middle" font-size="15" font-weight="600" fill="#213341">actor 的动作</text><text x="250.0" y="255.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#213341">可以离开 reference</text><polyline points="210,100 278,100" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah-1)"/><polyline points="365,130 300,208" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah-1)"/><text x="332.5" y="162.0" text-anchor="middle" font-size="12" fill="#536777">∇ₐQ 推动</text><polyline points="125,130 200,208" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-1)"/><text x="162.5" y="162.0" text-anchor="middle" font-size="12" fill="#536777">BC 拉回</text><rect x="520" y="10" width="470" height="300" rx="14" fill="#fafcfd" stroke="#d9e4e9"/><text x="755" y="40" text-anchor="middle" font-size="17" font-weight="650" fill="#213341">EXPO-FT：在候选中挑</text><rect x="550" y="70" width="170" height="60" rx="10" fill="#e8f1fb" stroke="#1d6fb8" stroke-width="1.6"/><text x="635.0" y="96.0" text-anchor="middle" font-size="15" font-weight="600" fill="#213341">VLA 采 N 个</text><text x="635.0" y="115.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#213341">base 候选</text><rect x="790" y="70" width="170" height="60" rx="10" fill="#f8ecf2" stroke="#8b375d" stroke-width="1.6"/><text x="875.0" y="96.0" text-anchor="middle" font-size="15" font-weight="600" fill="#213341">± β edit</text><text x="875.0" y="115.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#213341">N 个修正版</text><rect x="670" y="210" width="180" height="60" rx="10" fill="#fbf0e6" stroke="#a34f08" stroke-width="1.6"/><text x="760.0" y="236.0" text-anchor="middle" font-size="15" font-weight="600" fill="#213341">Q 取 argmax</text><text x="760.0" y="255.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#213341">只在 2N 个里选</text><polyline points="720,100 788,100" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah-1)"/><polyline points="635,130 720,208" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah-1)"/><polyline points="875,130 800,208" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah-1)"/></svg>
