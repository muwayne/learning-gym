<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-label="BFM-Zero 的训练信息与部署控制接口"><title>BFM-Zero 的训练信息与部署控制接口</title><defs><marker id="zs-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#518492"/></marker></defs><style>text{font:16px system-ui,-apple-system,sans-serif;fill:#213341}.title{font-weight:700;fill:#15566a}.sub{font-size:14px;fill:#536777}.box{fill:#eef6f8;stroke:#aac8d1;stroke-width:1.4}.edge{fill:none;stroke:#518492;stroke-width:2;marker-end:url(#zs-arrow-3)}</style><rect class="box" x="20" y="35" width="245" height="82" rx="10"/><text class="title" x="34" y="64">Motion dataset</text><text class="sub" x="34" y="93">State-only motions → B 编码 z</text><rect class="box" x="500" y="35" width="280" height="82" rx="10"/><text class="title" x="514" y="64">Simulator full state</text><text class="sub" x="514" y="93">Privileged FB / style / penalty critics</text><rect class="box" x="20" y="205" width="245" height="82" rx="10"/><text class="title" x="34" y="234">可部署的 history</text><text class="sub" x="34" y="263">Observation + action history</text><rect class="box" style="fill:#dff0e8" x="500" y="205" width="280" height="82" rx="10"/><text class="title" x="514" y="234">Actor · history + z</text><text class="sub" x="514" y="263">训练梯度来自 privileged critics</text><rect class="box" x="500" y="360" width="280" height="82" rx="10"/><text class="title" x="514" y="389">PD controller → robot</text><text class="sub" x="514" y="418">执行动作并返回新 observation</text><path class="edge" d="M265,76 H365 V245 H492"/><path class="edge" d="M640,117 V197"/><path class="edge" d="M265,246 H492"/><path class="edge" d="M640,287 V352"/><path class="edge" d="M500,401 H340 V310 H142 V295"/><text class="sub" x="20" y="390">训练信息与部署信息分开。</text><text class="sub" x="20" y="420">Actor 不能依赖部署时不存在的 full state。</text></svg>
