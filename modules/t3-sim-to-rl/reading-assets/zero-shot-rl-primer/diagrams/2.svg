<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 465" role="img" aria-label="FB 一次 batch 的数据来源、目标与更新路径"><title>FB 一次 batch 的数据来源、目标与更新路径</title><defs><marker id="zs-arrow-2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#518492"/></marker></defs><style>text{font:16px system-ui,-apple-system,sans-serif;fill:#213341}.title{font-weight:700;fill:#15566a}.sub{font-size:14px;fill:#536777}.box{fill:#eef6f8;stroke:#aac8d1;stroke-width:1.4}.edge{fill:none;stroke:#518492;stroke-width:2;marker-end:url(#zs-arrow-2)}</style><rect class="box" x="20" y="30" width="235" height="82" rx="10"/><text class="title" x="34" y="59">Replay transitions</text><text class="sub" x="34" y="88">真实 s,a,s′ 与独立终点 s⁺</text><rect class="box" x="545" y="30" width="235" height="82" rx="10"/><text class="title" x="559" y="59">任务向量 z</text><text class="sub" x="559" y="88">采样任务族；条件策略</text><rect class="box" x="20" y="175" width="235" height="82" rx="10"/><text class="title" x="34" y="204">在线 F 与 B</text><text class="sub" x="34" y="233">表示当前 πz 的未来访问</text><rect class="box" x="545" y="175" width="235" height="82" rx="10"/><text class="title" x="559" y="204">Actor 与 target copies</text><text class="sub" x="559" y="233">π(s′,z)；F̄ / B̄ stop-gradient</text><rect class="box" x="20" y="320" width="235" height="82" rx="10"/><text class="title" x="34" y="349">Bellman + normalization</text><text class="sub" x="34" y="378">更新 F/B；锚定与递推</text><rect class="box" x="545" y="320" width="235" height="82" rx="10"/><text class="title" x="559" y="349">Actor objective</text><text class="sub" x="559" y="378">最大化 F(s,π(s,z),z)ᵀz</text><path class="edge" d="M137,112 V167"/><path class="edge" d="M662,112 V167"/><path class="edge" d="M255,70 H390 V216 H537"/><path class="edge" d="M545,70 H410 V216 H263"/><path class="edge" d="M137,257 V312"/><path class="edge" d="M545,216 H420 V361 H263"/><path class="edge" d="M255,216 H380 V361 H537"/><path class="edge" d="M662,320 V265"/><text class="sub" x="20" y="440">更新阶段分开：target 不回传梯度；actor 更新保留 critic 对 action 的梯度。</text></svg>
